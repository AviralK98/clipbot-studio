[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbot"
version = "0.1.0"
description = "Autonomous authorized-content clipping and distribution"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "httpx>=0.28,<1", "itsdangerous>=2.2,<3", "feedparser>=6,<7", "defusedxml>=0.7,<1", "tzdata>=2025.1", "cryptography>=44", "openai>=1.66,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11"]
[tool.setuptools.packages.find]
where = ["apps/backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/backend"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
